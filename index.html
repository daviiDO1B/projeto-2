<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trabalho de Física - Flashcards</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1> Flashcards de Física: Espelhos e Lentes </h1>
  <p class="instrucao">Clique no card para ver a resposta!</p>

  <div class="card-container">
    <div class="card" id="card" onclick="virarCard()">
      <div class="frente">
        <img id="card-img" src="" alt="Imagem da questão">
        <h2 id="card-titulo">Título</h2>
      </div>
      <div class="verso">
        <h2>Resposta:</h2>
        <p id="card-resposta">Texto da resposta</p>
      </div>
    </div>
  </div>

  <div class="botoes">
    <button onclick="cardAnterior()">Voltar</button>
    <button onclick="proximoCard()">Avançar</button>
  </div>

  <script src="script.js"></script>
</body>
